name: Build Standalone Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Android Native Files
        run: npx expo prebuild --platform android --clean

      - name: Configure Signing & Build Standalone Release APK
        working-directory: android
        run: |
          # Use debug signing key so the release APK is pre-signed and standalone
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' app/build.gradle
          ./gradlew assembleRelease

      - name: Upload Downloadable Standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: Pokedex-Standalone-APK
          path: android/app/build/outputs/apk/release/*.apk
